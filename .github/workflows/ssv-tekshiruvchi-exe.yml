name: SSV tekshiruvchi (.exe)

on:
  push:
    paths:
      - "ssv_tekshiruvchi/**"
      - ".github/workflows/ssv-tekshiruvchi-exe.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ssv_tekshiruvchi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.10.0 pytest

      - name: Testlar
        run: python -m pytest -q tests

      - name: .exe yig'ish
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SSV_Tekshiruvchi
          --add-data "nazoratlar.xlsx;."
          --hidden-import xlrd
          app.py

      - uses: actions/upload-artifact@v4
        with:
          name: SSV_Tekshiruvchi
          path: |
            ssv_tekshiruvchi/dist/SSV_Tekshiruvchi.exe
            ssv_tekshiruvchi/README.md
          retention-days: 30
